name: Release obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npx eslint .
      - name: Review-style checks (eslint-disable pairing + manifest BOM)
        run: node scripts/check-review-lint.mjs
      - run: npm run build --if-present
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "DeepSeek Harness Obsidian plugin $tag

          Features:
          - Embed the DSH Web GUI (iframe) with one-click install/detection and auto service startup (silent on Windows)
          - One-click install auto-installs missing tools (git/Node/pnpm) and shows a live progress bar (download % + stage timers)
          - Send selected text to DSH: fill into the DSH input via the official user-extension bridge (zero DSH changes), with direct-send fallback
          - Bilingual UI (Chinese / English) — follows Obsidian; non-Chinese system languages fall back to English
          - \"Ask AI how to fix\" on error: copies an auto-composed diagnostic and opens the DeepSeek web chat
          - Runtime service monitoring, update check (fast-forward pull), page zoom, source-path tag
          - macOS / Windows / Linux

          Assets are built from source and attestation-signed by GitHub Actions.

          See the repository README for install instructions and settings." \
            main.js manifest.json styles.css
