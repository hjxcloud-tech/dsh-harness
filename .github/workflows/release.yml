name: Release obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check (tsc, zero platform dependency)
        run: npm run typecheck
      - name: Review-style checks (eslint-disable pairing + manifest BOM/description)
        run: node scripts/check-review-lint.mjs
      - run: npm run build --if-present
      # ---- 发布产物门禁（叠加 A）：校验三件套，杜绝 main 不更新 / styles 丢失 / 版本错配 ----
      - name: Verify release assets (gate)
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/}"
          # 1) tag 不得带 v 前缀（Obsidian 要求与 manifest version 完全一致）
          if [[ "$tag" == v* ]]; then
            echo "::error::tag must not start with 'v' (got '$tag'); Obsidian matches manifest version to the release tag"
            exit 1
          fi
          # 2) main.js / styles.css 必须存在且非空（本次构建产物）
          for f in main.js styles.css manifest.json; do
            if [[ ! -s "$f" ]]; then
              echo "::error::$f missing or empty after build"
              exit 1
            fi
          done
          # 3) manifest.json version 必须与 tag 一致（否则 Obsidian 找不到匹配 Release 而不更新）
          ver="$(node -p "require('./manifest.json').version")"
          if [[ "$ver" != "$tag" ]]; then
            echo "::error::manifest version '$ver' != tag '$tag'"
            exit 1
          fi
          echo "✓ release assets verified: tag=$tag version=$ver main=$(stat -c%s main.js)B styles=$(stat -c%s styles.css)B"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "DeepSeek Harness Obsidian plugin $tag

          Features:
          - Embed the DSH Web GUI (iframe) with one-click install/detection and auto service startup (silent on Windows)
          - One-click install auto-installs missing tools (git/Node/pnpm) and shows a live progress bar (download % + stage timers)
          - Send selected text to DSH: the implicit bridge line appears when you focus the chat box, rewritten in place so it never clears your input or steals the caret
          - Two-way bridge: DSH outputs inside your vault open in the editor; [[wikilinks]] in chat are clickable
          - Attachment uploads work inside the panel and keep native percentage progress (system browser behaviour untouched)
          - Multi-profile coexistence: bind the panel to another profile while the desktop app keeps its own, one port per instance; restarting only ever touches instances this plugin launched, and foreign DSH processes are never killed
          - Compatibility self-check on startup: verifies the local DSH version against the verified range and that the bridge is actually live in the served page, with fix actions in the dialog; the plugin info row links to the full compatibility explanation
          - Update channel you control (stable / follow pushed / include alpha) plus an optional automatic check that always asks before installing
          - Only the official DSH package counts: versions are read from the official manifests, never from third-party same-named packages on npm
          - Bilingual UI (Chinese / English); other system languages fall back to English. AED safe-mode rescue, session format repair, credential self-heal, page zoom, shortcut passthrough
          - macOS / Windows / Linux (desktop)

          Assets are built from source and attestation-signed by GitHub Actions.

          See the repository README for install instructions and settings." \
            main.js manifest.json styles.css
